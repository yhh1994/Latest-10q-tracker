name: Update SEC Data

on:
  schedule:
    # Runs at minute 0 past every hour on weekdays (Monday through Friday)
    - cron: '0 * * * 1-5' 
  workflow_dispatch: # This adds a button allowing you to run it manually

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    
    # We need to explicitly grant write permissions to push the data.json file
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Generate S&P 500 Master List
        run: python generate_sp500.py

      - name: Fetch Historical 10-Qs
        run: python fetch.py
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sp500.json data.json
          git commit -m "Auto-update S&P 500 master list and 10-Q data" || exit 0
          git push

    
